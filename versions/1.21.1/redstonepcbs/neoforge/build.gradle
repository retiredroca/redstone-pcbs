plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def repoRoot = projectDir
while (repoRoot != null && !new File(repoRoot, 'gradle/versions.gradle').exists()) {
    repoRoot = repoRoot.parentFile
}
apply from: new File(repoRoot, 'gradle/versions.gradle')

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// See the Fabric build for why the shared sources are relocated into a loader-specific package: it
// lets a single merged jar contain both the Fabric and NeoForge mapping variants.
def commonPrefix = mod_group_id
def relocatedPrefix = "${mod_group_id}.neoforge.common"

tasks.register('relocateCommonSources', Sync) {
    from(rootProject.file('../common/src/main/java'))
    into(layout.buildDirectory.dir('generated/common'))
    filter { String line ->
        line.replace(commonPrefix, relocatedPrefix)
    }
}

tasks.register('relocateLoaderSources', Sync) {
    from('src/main/java')
    into(layout.buildDirectory.dir('generated/loader'))
    filter { String line ->
        def matcher = line =~ /import ${java.util.regex.Pattern.quote(commonPrefix)}\.(?!fabric\b|neoforge\b|mixin\b)([A-Za-z0-9_.]+);/
        if (matcher.find()) {
            return "import ${relocatedPrefix}.${matcher.group(1)};"
        }
        return line
    }
}

sourceSets {
    main {
        java {
            srcDirs = []
            srcDir(tasks.named('relocateCommonSources'))
            srcDir(tasks.named('relocateLoaderSources'))
        }
        resources {
            // Shared assets/data live once in ../common; only loader metadata stays per-loader.
            srcDir(rootProject.file('../common/src/main/resources'))
        }
    }
}

base {
    archivesName = 'neoforge-' + mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', rootProject.file('../common/src/main/resources').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            neo_version            : neo_version,
            loader_version_range   : '[1,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Keep build/libs to this build's jars only: drop any kept from earlier version stamps.
tasks.named('build') {
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        if (!libs.isDirectory()) {
            return
        }
        def name = base.archivesName.get()
        def keep = ["${name}-${project.version}.jar".toString()] as Set
        libs.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !keep.contains(f.name)) {
                f.delete()
            }
        }
    }
}
