plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def repoRoot = projectDir
while (repoRoot != null && !new File(repoRoot, 'gradle/versions.gradle').exists()) {
    repoRoot = repoRoot.parentFile
}
apply from: new File(repoRoot, 'gradle/versions.gradle')

version = mod_version
group = mod_group_id

base {
    // The jar is named <mod-id>-<version>-fabric.jar (see jarFileName in gradle/versions.gradle), so
    // archivesName is the bare mod id and the loader is the trailing element of the file name.
    archivesName = mod_id
}
// Loom's remapJar, not jar, writes the final artifact, and it does NOT inherit archiveClassifier
// from jar - it produced the unclassified "redstonepcbs-<version>.jar" until this was set here too.
// The loader build's sweep and the root build's lookups both expect the classified name.
// Name the file rather than using archiveClassifier. A classifier is part of the published maven
// identity, so a multi-module project using this template would land it in repo/ as
// <artifactId>-<version>-<loader>.jar and every host module would fail to resolve the library.
// archiveFileName renames the file and leaves the classifier empty, so coordinates stay untouched.
// Set on remapJar as well as jar: remapJar writes the final artifact and does not inherit
// archiveFileName from jar (the jar task's own output goes to build/devlibs).
tasks.named('jar') { archiveFileName = jarFileName(mod_id, mod_version, 'fabric') }
tasks.named('remapJar') { archiveFileName = jarFileName(mod_id, mod_version, 'fabric') }

// The shared sources are compiled once per loader. To let a single merged jar hold both the Fabric
// (intermediary) and NeoForge (Mojang) variants, each loader gets its own copy of the common classes
// under a loader-specific sub-package (e.g. <group>.fabric.common.*), so the two mapping variants do
// not collide by class name.
def commonPrefix = mod_group_id
def relocatedPrefix = "${mod_group_id}.fabric.common"

tasks.register('relocateCommonSources', Copy) {
    from(rootProject.file('../common/src/main/java'))
    into(layout.buildDirectory.dir('generated/common'))
    filter { String line ->
        line.replace(commonPrefix, relocatedPrefix)
    }
}

tasks.register('relocateLoaderSources', Copy) {
    from('src/main/java')
    into(layout.buildDirectory.dir('generated/loader'))
    filter { String line ->
        def matcher = line =~ /import ${java.util.regex.Pattern.quote(commonPrefix)}\.(?!fabric\b|neoforge\b|mixin\b)([A-Za-z0-9_.]+);/
        if (matcher.find()) {
            return "import ${relocatedPrefix}.${matcher.group(1)};"
        }
        return line
    }
}

sourceSets {
    main {
        java {
            srcDirs = []
            srcDir(tasks.named('relocateCommonSources'))
            srcDir(tasks.named('relocateLoaderSources'))
        }
        resources {
            // Shared assets/data live once in ../common; only loader metadata stays per-loader.
            srcDir(rootProject.file('../common/src/main/resources'))
        }
    }
}

loom {
    // Official Mojang mappings so the source matches the NeoForge build 1:1.
    officialMojangMappings()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    inputs.property "java_version", java_version
    inputs.property "mod_id", mod_id

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "java_version": java_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_license": mod_license,
                "mod_authors": mod_authors
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

// The sources jar is a release-shaped artifact too, so it takes the same name as the others -- with
// the project abbreviation. Without this it keeps the bare archivesName, which is neither
// standardized nor what the keep-set below expects.
tasks.named('sourcesJar') { archiveFileName = jarFileName(mod_id, mod_version, 'sources') }
tasks.named('remapSourcesJar') { archiveFileName = jarFileName(mod_id, mod_version, 'sources') }

// Keep build/libs to this build's jars only: drop any kept from earlier version stamps.
tasks.named('build') {
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        if (!libs.isDirectory()) {
            return
        }
        def keep = [jarFileName(mod_id, mod_version, 'fabric').toString(),
                    jarFileName(mod_id, mod_version, 'sources').toString()] as Set
        libs.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !keep.contains(f.name)) {
                f.delete()
            }
        }
    }
}
